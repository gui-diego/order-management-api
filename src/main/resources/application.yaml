spring:
  application:
    name: order-management

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

payment:
  simulated-max-amount: 10000.00

security:
  jwt:
    secret: ${JWT_SECRET:order-management-dev-secret-key-32b}
    expiration-minutes: 120
