services:

  mysql:
    image: mysql:8.0
    container_name: order-management-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_management

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: order-management-api

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_management
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: